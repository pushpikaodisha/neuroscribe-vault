<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#141E30"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="480" rx="16" fill="url(#bg)"/>
  
  <text x="550" y="38" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">NEUROSCRIBE STUDIO KNOWLEDGE GRAPH &amp; SEMANTIC VAULT PIPELINE</text>
  <text x="550" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Markdown Storage → [[WikiLinks]] Parser → SQLite FTS5 Search → Force-Directed Physics → 2D/3D Graph Canvas</text>

  <!-- Step 1: Markdown Notes Vault -->
  <g transform="translate(50, 95)">
    <rect width="210" height="250" rx="10" fill="#141E30" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="105" y="30" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. LOCAL VAULT (.MD)</text>
    
    <rect x="15" y="55" width="180" height="35" rx="6" fill="#1E2E4A"/>
    <text x="30" y="77" fill="#E2E8F0" font-family="monospace" font-size="11">AI_Ethics.md</text>

    <rect x="15" y="100" width="180" height="35" rx="6" fill="#1E2E4A"/>
    <text x="30" y="122" fill="#E2E8F0" font-family="monospace" font-size="11">Quantum_Gates.md</text>

    <rect x="15" y="145" width="180" height="35" rx="6" fill="#1E2E4A"/>
    <text x="30" y="167" fill="#E2E8F0" font-family="monospace" font-size="11">Neuroplasticity.md</text>

    <text x="105" y="210" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">12 Research Notes</text>
    <text x="105" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">YAML Frontmatter</text>
  </g>

  <path d="M 270 220 L 315 220" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="320,220 310,215 310,225" fill="#38BDF8"/>

  <!-- Step 2: Syntax & Links Parser -->
  <g transform="translate(325, 95)">
    <rect width="220" height="250" rx="10" fill="#141E30" stroke="#818CF8" stroke-width="1.5"/>
    <text x="110" y="30" fill="#818CF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. SYNTAX PARSER</text>
    
    <rect x="15" y="55" width="190" height="45" rx="6" fill="#1E2E4A"/>
    <text x="110" y="77" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">[[WikiLinks]] Extraction</text>
    <text x="110" y="93" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">74 Active Link Edges</text>

    <rect x="15" y="110" width="190" height="45" rx="6" fill="#1E2E4A"/>
    <text x="110" y="132" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">#Tag Taxonomies</text>
    <text x="110" y="148" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">27 Semantic Clusters</text>

    <rect x="15" y="165" width="190" height="45" rx="6" fill="#1E2E4A"/>
    <text x="110" y="187" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Backlink Indexer</text>
    <text x="110" y="203" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Bi-directional Graph</text>
  </g>

  <path d="M 555 220 L 600 220" stroke="#818CF8" stroke-width="2.5"/>
  <polygon points="605,220 595,215 595,225" fill="#818CF8"/>

  <!-- Step 3: SQLite FTS5 & Physics Simulator -->
  <g transform="translate(610, 95)">
    <rect width="230" height="250" rx="10" fill="#141E30" stroke="#6366F1" stroke-width="1.5"/>
    <text x="115" y="30" fill="#6366F1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. PHYSICS ENGINE</text>
    
    <rect x="15" y="55" width="200" height="50" rx="6" fill="#1E2E4A"/>
    <text x="115" y="78" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Coulomb Repulsion:</text>
    <text x="115" y="96" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">F_repel = k_r / d²</text>

    <rect x="15" y="115" width="200" height="50" rx="6" fill="#1E2E4A"/>
    <text x="115" y="138" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Hooke Spring Attraction:</text>
    <text x="115" y="156" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">F_spring = -k_s(d - d0)</text>

    <rect x="15" y="175" width="200" height="50" rx="6" fill="#1E2E4A"/>
    <text x="115" y="198" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SQLite FTS5 Full-Text Search</text>
  </g>

  <path d="M 850 220 L 890 220" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="895,220 885,215 885,225" fill="#10B981"/>

  <!-- Step 4: Interactive Graph UI -->
  <g transform="translate(900, 95)">
    <rect width="160" height="250" rx="10" fill="#141E30" stroke="#10B981" stroke-width="2"/>
    <text x="80" y="30" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. GRAPH UI</text>
    
    <rect x="15" y="55" width="130" height="175" rx="8" fill="#090E17"/>
    <circle cx="80" cy="100" r="12" fill="#38BDF8"/>
    <circle cx="50" cy="150" r="10" fill="#818CF8"/>
    <circle cx="110" cy="155" r="10" fill="#818CF8"/>
    <circle cx="80" cy="195" r="8" fill="#10B981"/>
    
    <line x1="80" y1="100" x2="50" y2="150" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="80" y1="100" x2="110" y2="155" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="50" y1="150" x2="80" y2="195" stroke="#818CF8" stroke-width="1.5"/>
    <line x1="110" y1="155" x2="80" y2="195" stroke="#818CF8" stroke-width="1.5"/>
  </g>

  <g transform="translate(50, 365)">
    <rect width="1010" height="85" rx="8" fill="#0C1524" stroke="#1E2E4A"/>
    <text x="30" y="30" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🧠 KNOWLEDGE GRAPH PHYSICS &amp; WIKILINKS VAULT:</text>
    <text x="30" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Bi-directional links are dynamically parsed from plain text markdown notes to construct an interconnected research network.</text>
    <text x="30" y="68" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Force-directed simulation balances electrostatic repulsion with spring tension, creating self-organizing organic topic clusters.</text>
  </g>
</svg>